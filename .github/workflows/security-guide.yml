name: Security guide
on:
  pull_request:
    paths:
      - docs/security.ai.md
      - scripts/security-guide.py
      - .github/workflows/security-guide.yml
  push:
    branches: [main]
    paths:
      - docs/security.ai.md
      - scripts/security-guide.py
      - .github/workflows/security-guide.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate guide
        run: python3 -I scripts/security-guide.py docs/security.ai.md
      - name: Report proposed changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:docs/security.ai.md" > "$RUNNER_TEMP/security-baseline.ai.md"
          python3 -I scripts/security-guide.py docs/security.ai.md --baseline "$RUNNER_TEMP/security-baseline.ai.md"
